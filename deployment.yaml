apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: masthan14/myapp1:${DOCKER_TAG} # Assuming this is your custom image with Tomcat
        ports:
        - containerPort: 8080
